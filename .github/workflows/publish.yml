name: Publish

# Publishes built .rbxmx artifacts from a published GitHub release to Roblox via rbxasset.
# Secrets: ROBLOX_API_KEY. Vars: ROBLOX_CREATOR_ID.
# Note: rbxasset 0.2.x may reject type=Plugin until Open Cloud supports it.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download "${{ github.event.release.tag_name }}" --dir build --pattern '*.rbxmx'

      - name: Publish each plugin
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_CREATOR_ID: ${{ vars.ROBLOX_CREATOR_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_API_KEY:-}" ] || [ -z "${ROBLOX_CREATOR_ID:-}" ]; then
            echo "ROBLOX_API_KEY and ROBLOX_CREATOR_ID are required"
            exit 1
          fi
          failed=0
          for rbxmx in build/*.rbxmx; do
            name=$(basename "$rbxmx" .rbxmx)
            printf '%s\n' \
              '[asset]' \
              "name = \"$name\"" \
              "description = \"$name Studio plugin\"" \
              'type = "Plugin"' \
              "creatorId = $ROBLOX_CREATOR_ID" \
              "path = \"$rbxmx\"" \
              > rbxasset.toml
            echo "Publishing $name..."
            if ! rbxasset publish; then
              echo "WARN: rbxasset publish failed for $name (Plugin type may be unsupported by Open Cloud)"
              failed=1
            fi
          done
          exit "$failed"
