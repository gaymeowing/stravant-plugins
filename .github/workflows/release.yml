name: Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/**/PLUGIN.toml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Create draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lute scripts/createReleases.luau
