name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: studio-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Install Wally packages
        run: wally install

      - name: Install Roblox Studio
        timeout-minutes: 10
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
        run: lute scripts/installStudio.luau

      - name: Run tests
        run: lute run scripts/test all
